{% extends "base.html" %}

{% block title %}{{ title }} - 管理后台{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'admin_panel:dashboard' %}">管理后台</a></li>
                <li class="breadcrumb-item"><a href="{% url 'admin_panel:user_list' %}">用户管理</a></li>
                <li class="breadcrumb-item active">{{ title }}</li>
            </ol>
        </nav>

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{{ title }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">学号</label>
                        <input type="text" name="student_id" class="form-control" value="{{ form_values.student_id }}" {% if form_values.is_edit %}disabled{% endif %} required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        <input type="text" name="name" class="form-control" value="{{ form_values.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" placeholder="{% if form_values.is_edit %}留空则不修改密码{% else %}请输入密码{% endif %}">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_staff" id="is_staff" {% if form_values.is_staff %}checked{% endif %}>
                        <label class="form-check-label" for="is_staff">管理员权限</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_class_member" id="is_class_member" {% if form_values.is_class_member %}checked{% endif %}>
                        <label class="form-check-label" for="is_class_member">计入班级统计</label>
                        <div class="form-text">
                            班上一员就勾选，管理员同样计入应交人数与提交名单。
                            纯系统账号或外班 / 教师账号可取消勾选，不参与提交率统计。
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if form_values.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">激活状态</label>
                    </div>
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-primary btn-lg">💾 保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
