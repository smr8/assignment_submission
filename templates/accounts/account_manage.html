{% extends "base.html" %}

{% block title %}账号管理 - 作业提交系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">账号管理</h2>

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">修改账号信息</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label">姓名</label>
                        <input type="text" name="name" id="name" class="form-control" value="{{ user.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="student_id" class="form-label">学号</label>
                        <input type="text" name="student_id" id="student_id" class="form-control" value="{{ user.student_id }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">新密码</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="留空则不修改密码">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
